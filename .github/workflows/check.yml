name: Check
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Test with the runner's Chrome
        run: |
          export WANLONG_CHROME="$(command -v google-chrome)"
          "$WANLONG_CHROME" --version
          npm test
